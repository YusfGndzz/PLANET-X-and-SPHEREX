<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Harman - SPHEREx Zaman Tüneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Harman - SPHEREx Zaman Tüneli</h1>
            <p>NASA verileriyle gökyüzündeki değişimi keşfedin.</p>
        </header>

        <div id="target-buttons"></div>

        <div class="controls">
            <input type="text" id="ra-input" placeholder="RA (Derece)">
            <input type="text" id="dec-input" placeholder="Dec (Derece)">
            <input type="text" id="size-input" value="0.1" placeholder="Boyut">
            <button>Görüntüleri Yükle</button>
        </div>

        <div id="viewer-container">
            <p style="color: #64748b;">Henüz bir bölge yüklenmedi.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
